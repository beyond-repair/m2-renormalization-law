[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m2-renormalization-law"
version = "0.1.0"
description = "Claim-0 Stage-1 W(n) ansatz and gasket spectrum checks. Does not derive thrust or the rejected hybrid ratio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All Rights Reserved" }
authors = [{ name = "Brian Ware" }]
dependencies = [
  "numpy>=1.25,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
m2-renormalization = "m2.report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["m2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
