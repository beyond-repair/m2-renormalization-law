name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy pytest
      - name: Run parameter-free sweep lock
        run: python3 scripts/parameter_free_sweep.py
      - name: Spectral / W tests
        run: python3 -m pytest -q
